name: Node.js CICD
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  compile:
    runs-on: Agent-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Source Compilation (Syntax Check)
        run: |
          find src -name "*.js" -exec node --check {} +

      - name: Test Files Compilation (Syntax Check)
        run: |
          find tests -name "*.js" -exec node --check {} +

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test
